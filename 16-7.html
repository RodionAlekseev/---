<html>
<head>
<tilte>Заявки</tilte>
</head>
<body>
<h2>Заявка на покупку товара</h2>
<b>Фамилия</b>
<input type=text size=30>
<b>Пароль</b>
<input type=password size=15>
<b>Адрес получателя</b>
<input type=text size=40><br>

<b>Тип товара</b>
<Select name=Тип>
<option> Монитор
<option> Мышь
<option> Клавиатура
<Select>

<b>Код товара</b>
<Select name=Код>
<option> 02354
<option> 16879
<option> 12345
<Select><br>

<b>Количество</b>
<input type=text size=10><br>

<b>Доставка транспортом</b><br>
<input type=radio name=fir><b>фирмы</b><br>
<input type=radio name=svoim><b>своим</b><br>

<b>Оплата наличными</b>
<input type="checkbox" name="test"><br>

<b>Дополнительная информация</b>
<input type=text size=30>
<input type="reset" value="Отправить" ID=Reset1>
<input type="reset" value="Сброс" ID=Reset2>
</body>
</html>
