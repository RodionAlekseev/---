<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нумерованный список и бегущая строка</title>
  <style>
    @keyframes slide {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .running-text {
      white-space: nowrap;
      overflow: hidden;
      animation: slide 5s linear infinite;
    }
  </style>
</head>
<body>
  <h1>Нумерованный список и бегущая строка</h1>
  
  <ol>
    <li>Первый пункт</li>
    <li>Второй пункт</li>
    <li>Третий пункт</li>
  </ol>

  <div class="running-text">Это бегущая строка с определенным характером движения.</div>
</body>
</html>
